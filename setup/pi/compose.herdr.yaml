# Explicit opt-in only; setup/bin/pi supplies validated host context.
# Session target interpolation in compose.yaml gives restore a stable namespace.
services:
  pi:
    environment:
      HERDR_ENV: "1"
      HERDR_PANE_ID: "${HERDR_PANE_ID:?}"
      HERDR_SOCKET_PATH: /run/herdr/herdr.sock
    volumes:
      - type: bind
        source: "${HERDR_SOCKET_HOST_PATH:?}"
        target: /run/herdr/herdr.sock
        bind:
          create_host_path: false
