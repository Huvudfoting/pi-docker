services:
  pi:
    image: pi-agent:latest
    build: .
    init: true
    stdin_open: true
    tty: true
    user: "${PI_UID:-1000}:${PI_GID:-1000}"
    environment:
      HOME: /home/node
      EDITOR: nano
      VISUAL: nano
      PI_CODING_AGENT_DIR: /pi/agent
      PI_CODING_AGENT_SESSION_DIR: "${PI_SESSION_TARGET:-/pi/sessions}"
      GH_CONFIG_DIR: /run/gh-config
    volumes:
      - ${PI_CONFIG:?}:/pi/agent
      - ${PI_SESSIONS:?}:${PI_SESSION_TARGET:-/pi/sessions}
      - ${PI_WORKSPACE:?}:/workspace
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro
      - type: bind
        source: ${GH_CONFIG:?}
        target: /run/gh-config
        read_only: true
        bind:
          create_host_path: false
      # Only safe deployment source lives here; private state is in ../../data/.
      - type: bind
        source: ../
        target: /opt/pi-docker
        read_only: true
        bind:
          create_host_path: false
    working_dir: /workspace
    networks:
      - ollama
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  ollama:
    external: true
    name: ${OLLAMA_NETWORK:-pi-ollama}
