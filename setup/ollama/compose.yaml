# From the repository root:
# docker compose --env-file data/ollama.env -f setup/ollama/compose.yaml up -d
# Keep real environment values outside the read-only setup mount.
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - type: bind
        source: ${OLLAMA_MODELS:?Set an absolute model-store path in data/ollama.env}
        target: /models
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - ollama
networks:
  ollama:
    name: ${OLLAMA_NETWORK:-pi-ollama}
    driver: bridge
