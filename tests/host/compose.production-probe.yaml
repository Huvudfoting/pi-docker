# Test-only overrides on the ACTUAL deployment Compose service. No Pi runs.
# All private bind sources come from fixtures; deployment source stays read-only.
services:
  pi:
    image: "${PROBE_IMAGE_ID:?}"
    entrypoint: ["node", "/probe/container-probe.js"]
    command: []
    stdin_open: false
    tty: false
    network_mode: none
    read_only: true
    mem_limit: 512m
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m,mode=1777
    environment:
      HOME: /tmp
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_AUTHOR_NAME: Mount Fixture
      GIT_AUTHOR_EMAIL: mount-fixture@example.invalid
      GIT_COMMITTER_NAME: Mount Fixture
      GIT_COMMITTER_EMAIL: mount-fixture@example.invalid
      PROBE_PRODUCTION: "1"
      PROBE_IMAGE_ID: "${PROBE_IMAGE_ID:?}"
      PROBE_FIXTURES: "${PROBE_FIXTURES:?}"
      PROBE_DEPLOYMENT: "${PROBE_DEPLOYMENT:?}"
      PROBE_CHECKOUT: "${PROBE_CHECKOUT:?}"
      PROBE_TARGET: "${PROBE_TARGET:?}"
      PROBE_WORKDIR: "${PROBE_WORKDIR:?}"
      PROBE_COMMON: "${PROBE_COMMON:-}"
      PROBE_METADATA: "${PROBE_METADATA:?}"
      PROBE_KIND: "${PROBE_KIND:?}"
      PROBE_ACTION: "${PROBE_ACTION:?}"
      PROBE_MAIN_SENTINEL: "${PROBE_MAIN_SENTINEL:-}"
      PROBE_BARRIER: "${PROBE_BARRIER:-}"
      PROBE_PARTICIPANT: "${PROBE_PARTICIPANT:-}"
    volumes:
      - type: bind
        source: "${PROBE_CODE:?}"
        target: /probe
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${PROBE_EFFECTIVE:?}"
        target: /probe-effective.json
        read_only: true
        bind:
          create_host_path: false
